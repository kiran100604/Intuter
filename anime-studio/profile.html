<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - INTUTER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="main-content" style="padding: 40px;">
            <div class="content-header">
                <h1>Your Study Sessions</h1>
                <p class="subtitle">Select a session to continue or create a new one.</p>
            </div>

            <div id="sessions-list"></div>

            <div id="session-creation">
                <h2>Create a new Study Session</h2>
                <form id="session-form">
                    <div class="form-group">
                        <label for="subjectName">Subject Name</label>
                        <input type="text" id="subjectName" name="subjectName" required>
                    </div>
                    <div class="form-group">
                        <label for="goal">Goal</label>
                        <input type="text" id="goal" name="goal" required>
                    </div>
                    <button type="submit" class="btn-primary">Create Session</button>
                </form>
            </div>
        </div>
    </div>
    <script src="profile.js"></script>
</body>
</html>
